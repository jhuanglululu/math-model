[project]
name = "mathrl"
version = "0.1.0"
description = "RL for LLM arithmetic reasoning: countdown +/- with tool tokens"
readme = "README.md"
authors = [
    { name = "jhuanglululu", email = "huangchuangyun22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
    "tqdm>=4.69.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
